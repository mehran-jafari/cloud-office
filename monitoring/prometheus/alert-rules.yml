groups:
  - name: cloud-office
    rules:
      - alert: CloudOfficeBackendDown
        expr: up{job="django"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Cloud Office backend is down
          description: Prometheus cannot scrape the Django metrics endpoint for 2 minutes.

      - alert: CloudOfficeHigh5xxRate
        expr: |
          sum(rate(cloud_office_http_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(cloud_office_http_requests_total[5m])), 1)
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Cloud Office 5xx rate is above 5%
          description: More than 5% of HTTP requests returned a 5xx response for 5 minutes.

      - alert: CloudOfficeHighP95Latency
        expr: histogram_quantile(0.95, sum(rate(cloud_office_http_request_duration_seconds_bucket[5m])) by (le)) > 1.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Cloud Office p95 latency is high
          description: HTTP p95 latency has been above 1.5 seconds for 10 minutes.

      - alert: CloudOfficeMinioDown
        expr: up{job="minio"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: MinIO metrics endpoint is down
          description: Prometheus cannot scrape MinIO cluster metrics.

      - alert: CloudOfficeContainerMemoryHigh
        expr: |
          sum(container_memory_working_set_bytes) by (name)
          /
          clamp_min(sum(container_spec_memory_limit_bytes) by (name), 1)
          > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: A container is using over 90% of its memory limit
          description: Container {{ $labels.name }} has sustained high memory usage.
